name: Deploy Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build public app
        run: |
          npm ci
          npm run build

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade huggingface_hub

      - name: Deploy Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.PULSR_CV }}
          HF_SPACE_ID: qyam23/pulse-cv
          HF_MODEL: Qwen/Qwen3-32B:nscale
          HF_MODEL_CANDIDATES: Qwen/Qwen3-32B:nscale,Qwen/Qwen3-32B:ovhcloud,Qwen/Qwen3-Coder-30B-A3B-Instruct:ovhcloud,Qwen/Qwen2.5-Coder-7B-Instruct:nscale,openai/gpt-oss-20b:groq,openai/gpt-oss-20b
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not configured. Skipping Hugging Face Space deployment."
            exit 0
          fi
          python scripts/deploy_hf_space.py
