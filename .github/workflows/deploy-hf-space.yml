name: Deploy Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade huggingface_hub

      - name: Deploy Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.PULSR_CV }}
          HF_SPACE_ID: qyam23/pulse-cv
          HF_MODEL: Qwen/Qwen3-32B
          HF_MODEL_CANDIDATES: Qwen/Qwen3-32B,deepseek-ai/DeepSeek-R1-Distill-Qwen-32B,Qwen/Qwen2.5-Coder-32B-Instruct
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not configured. Skipping Hugging Face Space deployment."
            exit 0
          fi
          python scripts/deploy_hf_space.py
